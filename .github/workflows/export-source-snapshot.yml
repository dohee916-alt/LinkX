name: Export Current Source Snapshot
on:
  push:
    paths:
      - '.github/workflows/export-source-snapshot.yml'
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip all current source files
        run: zip -qr LinkX-current-source.zip . -x '.git/*' 'LinkX-current-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: LinkX-current-source
          path: LinkX-current-source.zip
          retention-days: 1
