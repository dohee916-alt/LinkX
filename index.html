function api(){return phone.contentWindow}function highlight(g,k){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.group===g&&b.dataset.key===k))}
function apply(item){const [g,p,k,n]=item;try{const w=api();if(p===R){const a=w.LinkXRoleplay;if(k==='suggest'){a.go('ready1');a.suggest()}else if(k==='modal'){a.go('ready1');a.modal()}else a.go(k)}else if(p===M)w.LinkXMissionReward.inspect(k);else if(p===F)w.LinkXFeedback.go(+k)}catch(e){note.textContent='화면 연결을 확인할 수 없습니다: '+e.message}}
function choose(item){selected=item;const[g,p,k,n]=item;title.textContent=g+' / '+n;highlight(g,k);note.textContent=p===F?'첨부된 구조 개요 기반 · 원본 디자인 미반영':p?'오른쪽 화면에서 직접 조작할 수 있습니다.':'구현 예정';const special=[R,M,F].includes(p);const url=p?(special?p:p+k):'';document.querySelector('#external').href=url||'#';if(!p){loaded='';pending=null;phone.srcdoc='<body style="font:16px system-ui;display:grid;place-items:center;height:95vh">구현 예정</body>';return}if(special&&loaded===p&&((p===R&&api().LinkXRoleplay)||(p===M&&api().LinkXMissionReward)||(p===F&&api().LinkXFeedback))){apply(item);return}pending=special?item:null;loaded=p;phone.removeAttribute('srcdoc');phone.src=url}
phone.addEventListener('load',()=>{if(pending){const item=pending;pending=null;apply(item);return}try{const u=new URL(phone.contentWindow.location.href);const module=u.pathname.match(/\/modules\/([^/]+)\//)?.[1];if(module){loaded='modules/'+module+'/index.html';const g=groups.find(x=>x[1]===loaded);if(g&&(!selected||selected[1]!==loaded)){const row=g[2][0];selected=[g[0],loaded,row[0],row[1]];title.textContent=g[0]+' / '+row[1];highlight(g[0],row[0]);document.querySelector('#external').href=u.href}}}catch{}});
function build(){const q=document.querySelector('#search').value.toLowerCase();for(const section of list.querySelectorAll('section')){let count=0;for(const b of section.querySelectorAll('button')){b.hidden=!(b.dataset.group+' '+b.textContent).toLowerCase().includes(q);if(!b.hidden)count++}section.hidden=!count}if(selected)highlight(selected[0],selected[2])}
list.addEventListener('click',e=>{const b=e.target.closest('button[data-path]');if(b)choose([b.dataset.group,b.dataset.path,b.dataset.key,b.textContent])});
document.querySelector('#search').oninput=build;document.querySelector('#reset').onclick=()=>{if(selected){loaded='';choose(selected)}};document.querySelector('#resume').onclick=()=>{try{const w=api();if(w.LinkXMissionReward)w.LinkXMissionReward.resume();else if(w.LinkXFeedback)w.LinkXFeedback.resume();else if(w.LinkXRoleplay)w.LinkXRoleplay.go(w.LinkXRoleplay.current())}catch{}};
setInterval(()=>{try{const w=api(),r=w.LinkXRoleplay,m=w.LinkXMissionReward,f=w.LinkXFeedback;if(r)highlight('롤플레잉',r.current());if(m){const k=m.current();const g=groups.find(x=>x[1]===M&&x[2].some(y=>y[0]===k));if(g)highlight(g[0],k)}if(f)highlight('텍스트 모드 · 피드백',String(f.current()))}catch{}},250);
const stage=document.querySelector('#stage');function fit(){phone.style.transform='translate(-50%,-50%) scale('+Math.max(0.01,Math.min(1,(stage.clientWidth-24)/390,(stage.clientHeight-24)/844))+')'}if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);window.addEventListener('resize',fit);fit();build();choose(['메인','modules/main/index.html','','메인 화면']);
</script></html>
