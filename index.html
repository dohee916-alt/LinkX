<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkX · Prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f7;color:#252631;font:14px system-ui,sans-serif;display:grid;grid-template-columns:310px 1fr;height:100dvh}aside{background:white;border-right:1px solid #e2e3e8;display:flex;flex-direction:column;min-height:0}header{padding:22px 20px 14px}h1{margin:0;font-size:24px}small{color:#737580}input{margin:0 16px 12px;padding:10px;border:1px solid #ddd;border-radius:8px}nav{overflow:auto;padding:0 12px 20px}h3{font-size:12px;color:#777;margin:20px 8px 6px}button{font:inherit;cursor:pointer}nav button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 12px;border-radius:7px;color:#343440}nav button:hover,nav button.active{background:#e9e9f7;color:#5146a5}main{min-width:0;display:flex;flex-direction:column;align-items:center;overflow:auto} .bar{width:100%;display:flex;gap:8px;align-items:center;padding:12px 20px;background:white;border-bottom:1px solid #ddd}.bar strong{flex:1}.bar button,.bar a{background:#fff;border:1px solid #ddd;padding:7px 10px;border-radius:7px;color:inherit;text-decoration:none}#stage{position:relative;flex:1;width:100%;min-height:0;display:grid;place-items:center;overflow:hidden}iframe{border:0;background:white;width:390px;height:844px;box-shadow:0 12px 36px #0002;transform-origin:center;border-radius:12px}#note{padding:8px 16px;color:#666;font-size:12px;text-align:center} @media(max-width:650px){body{grid-template-columns:150px 1fr}header{padding:12px}nav{padding:0 4px}nav button{font-size:12px}.bar{padding:8px;flex-wrap:wrap}.bar strong{width:100%;flex:auto}}
</style><aside><header><h1>LinkX</h1><small>전체 화면 플로우 · 개발용</small></header><input id="search" placeholder="화면 검색"><nav id="list"></nav></aside><main><div class="bar"><strong id="title">긴급대화</strong><button id="reset">다시 시작</button><button id="resume">자동 진행</button><a id="external" target="_blank" rel="noopener">새 창</a></div><div id="stage"><iframe id="phone" title="실제 프로토타입" allow="microphone; camera"></iframe></div><div id="note"></div></main><script>
const E='modules/emergency/index.html',S='modules/saved/index.html',R='modules/roleplay/index.html',M='modules/mission/index.html',F='modules/feedback/index.html';
const groups=[
['긴급대화',E,[['','시작 · 실제 흐름'],['?preview=greeting','첫 AI 인사'],['?preview=input','메시지 입력'],['?preview=loading','답변 생성 중'],['?preview=regenerate','답변 재생성'],['?preview=long','대화 이어가기'],['?preview=scroll','긴 대화 · 스크롤'],...['prepare','network','response','general'].map((v,i)=>['?preview=error&error='+v,['대화 준비 오류','네트워크 오류','응답 생성 오류','일반 오류'][i]]),['?preview=confirm','나가기 확인'],['?preview=transition','출발 전환'],['?preview=departure','출발 · 돌아왔어요']]],
['저장목록',S,[['?tab=emergency','긴급대화 저장목록'],['?tab=saved','북마크 저장목록'],['?tab=emergency&sort=old','오래된순'],['?tab=saved&menu=1','정렬 메뉴'],['?tab=emergency&preview=empty','빈 긴급대화'],['?tab=saved&preview=empty','빈 북마크']]],
['롤플레잉',R,[['ready1','01 시작'],['ready1r','02 답변 재생성'],['input1','03 음성 입력'],['gen1','04 AI 생성'],['err1','05 인터넷 오류'],['out1','06 AI 출력'],['ready2','07 두 번째 입력 전'],['input2','08 두 번째 입력'],['gen2','09 두 번째 생성'],['err2','10 알 수 없는 오류'],['out2','11 두 번째 출력'],['done','12 미션 완료'],['suggest','추천 문장'],['modal','나가기 팝업']]],
['미션',M,[['chat-mission-01','새 미션 알림'],['chat-mission-02','알림 펼침'],...Array.from({length:3},(_,i)=>['quest-01-'+(i+1),'첫 미션 부여 '+(i+1)]),['quest-loading','미션 로딩'],['quest-error','미션 오류']]],
['리워드',M,[['chat-done-01','리워드 알림'],['chat-done-02','알림 펼침'],['reward-1','별 누르기'],['reward-2','보상 애니메이션 1'],['reward-2-1','보상 애니메이션 2'],['reward-3','보상 확인'],['reward-decorate','장식하기'],['reward-check','리워드 확인 · 임시'],...Array.from({length:7},(_,i)=>['next-quest-'+(i+1),'다음 미션 '+(i+1)]),['reward-loading','리워드 로딩'],['reward-error','리워드 오류'],['main','메인 · 임시']]],
['텍스트 모드 · 피드백',F,["기본","상황 제시 01","상황 제시 02","카페 선택 대기","상황 선택 01","상황 선택 02","미션 발생 01","미션 발생 02","일시중지","피드백 로딩","피드백","피드백 꾹 누르기","북마크 대기","북마크 완료 01","북마크 완료 02","연습 로그","연습 로그 · 피드백 있음","네트워크 오류","일반 오류","대화 준비 오류","응답 생성 오류","미션 완료 보고","미션 완료 01","미션 완료 02"].map((n,i)=>[String(i+1),n])],
['공통','',[['home','메인 화면 · 구현 예정'],['onboarding','온보딩 · 구현 예정']]]];
const phone=document.querySelector('#phone'),list=document.querySelector('#list'),title=document.querySelector('#title'),note=document.querySelector('#note');let selected,loaded='',pending=null;
function api(){return phone.contentWindow}function highlight(g,k){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.group===g&&b.dataset.key===k))}
function apply(item){const [g,p,k,n]=item;try{const w=api();if(p===R){const a=w.LinkXRoleplay;if(k==='suggest'){a.go('ready1');a.suggest()}else if(k==='modal'){a.go('ready1');a.modal()}else a.go(k)}else if(p===M)w.LinkXMissionReward.inspect(k);else if(p===F)w.LinkXFeedback.go(+k)}catch(e){note.textContent='화면 연결을 확인할 수 없습니다: '+e.message}}
function choose(item){selected=item;const[g,p,k,n]=item;title.textContent=g+' / '+n;highlight(g,k);note.textContent=p===F?'첨부된 구조 개요 기반 · 원본 디자인 미반영':p?'오른쪽 화면에서 직접 조작할 수 있습니다.':'구현 예정';const special=[R,M,F].includes(p);const url=p?(special?p:p+k):'';document.querySelector('#external').href=url||'#';if(!p){loaded='';pending=null;phone.srcdoc='<body style="font:16px system-ui;display:grid;place-items:center;height:95vh">구현 예정</body>';return}if(special&&loaded===p){apply(item);return}pending=special?item:null;loaded=p;phone.removeAttribute('srcdoc');phone.src=url}
phone.addEventListener('load',()=>{if(pending){const item=pending;pending=null;apply(item)}});
function build(){list.replaceChildren();const q=document.querySelector('#search').value.toLowerCase();for(const[g,p,rows]of groups){const matches=rows.filter(([k,n])=>(g+' '+n).toLowerCase().includes(q));if(!matches.length)continue;const h=document.createElement('h3');h.textContent=g;list.append(h);for(const[k,n]of matches){const b=document.createElement('button');b.dataset.group=g;b.dataset.key=k;b.textContent=n;b.onclick=()=>choose([g,p,k,n]);list.append(b)}}if(selected)highlight(selected[0],selected[2])}
document.querySelector('#search').oninput=build;document.querySelector('#reset').onclick=()=>{if(selected){loaded='';choose(selected)}};document.querySelector('#resume').onclick=()=>{try{const w=api();if(w.LinkXMissionReward)w.LinkXMissionReward.resume();else if(w.LinkXFeedback)w.LinkXFeedback.resume();else if(w.LinkXRoleplay)w.LinkXRoleplay.go(w.LinkXRoleplay.current())}catch{}};
setInterval(()=>{try{const w=api(),r=w.LinkXRoleplay,m=w.LinkXMissionReward,f=w.LinkXFeedback;if(r)highlight('롤플레잉',r.current());if(m){const k=m.current();const g=groups.find(x=>x[1]===M&&x[2].some(y=>y[0]===k));if(g)highlight(g[0],k)}if(f)highlight('텍스트 모드 · 피드백',String(f.current()))}catch{}},250);
const stage=document.querySelector('#stage');new ResizeObserver(()=>{phone.style.transform='scale('+Math.min(1,stage.clientWidth/390,stage.clientHeight/844)+')'}).observe(stage);build();choose(['긴급대화',E,'','시작 · 실제 흐름']);
</script></html>
