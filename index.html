let routeSeq=0,routeTimer=0,routeBusy=false,routeBypass=false;
function cancelRoute(){routeSeq++;clearTimeout(routeTimer);routeBusy=false;routeBypass=false;phone.classList.remove('lx-route-fade','lx-route-out','lx-route-in');}
function routeTransition(action){
  cancelRoute();const seq=routeSeq;routeBusy=true;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){routeBypass=true;action();routeBusy=false;routeBypass=false;return;}
  phone.classList.add('lx-route-fade');
  routeTimer=setTimeout(()=>{
    if(seq!==routeSeq)return;phone.classList.add('lx-route-out');
    routeTimer=setTimeout(()=>{if(seq!==routeSeq)return;routeBypass=true;try{action()}catch(e){cancelRoute();throw e}},150);
  },150);

function modulePath(url){try{return new URL(url,location.href).pathname.match(/\/modules\/([^/]+)\//)?.[1]||''}catch{return ''}}

    if(win.__lxRouteWired)return;win.__lxRouteWired=true;
