<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>LinkX · 대화 모아보기</title><link rel="stylesheet" href="../../shared/tokens.css"><link rel="stylesheet" href="style.css?v=undo13"><style>.saved-row .bookmark img{transition:transform 100ms cubic-bezier(.2,.8,.2,1),opacity 100ms}.saved-row .bookmark:active img{transform:scale(.97);opacity:.65}</style></head><body class="saved-page"><main class="saved-frame" id="frame"><div class="saved-stars"></div><header><button id="back" aria-label="뒤로가기"><img src="../../assets/saved/back.svg" alt=""></button><h1>대화 모아보기</h1><button id="home" aria-label="홈"><img src="../../assets/saved/home.svg" alt=""></button></header><div class="saved-tabs" role="tablist"><button role="tab" id="emergency-tab"><span>긴급대화</span></button><button role="tab" id="saved-tab"><span>저장한 대화</span></button></div><div class="saved-tools"><span id="count"></span><button id="sort" aria-expanded="false"><span id="sort-label">최신순</span><img src="../../assets/saved/chevron.svg" alt=""><span class="up-arrow" aria-hidden="true">⌃</span></button></div><section class="saved-scroll" id="scroll" aria-label="대화 목록"><div id="rows"></div></section><div class="saved-track" id="track" hidden><div id="thumb"></div></div><section id="empty" hidden><img id="empty-icon" alt=""><h2 id="empty-title"></h2><p id="empty-desc"></p></section><div id="menu" class="saved-menu" hidden><button data-sort="new"><span>최신순</span><img src="../../assets/saved/check.svg" alt=""></button><button data-sort="old"><span>오래된순</span><img src="../../assets/saved/check.svg" alt=""></button></div><div id="undo-snackbar" hidden><span class="undo-message" role="status">저장을 해제했어요.</span><button id="undo-action" type="button">되돌리기</button></div><script>/* Common 390px iPhone status bar. Time follows exhibition device local clock. */
(()=>{const style=document.createElement('style');style.textContent='.lx-unified-status{position:absolute;left:0;top:0;width:390px;height:44px;z-index:2147483647;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:none;color:#F8F3E6;font:600 15px/1 -apple-system,BlinkMacSystemFont,Arial,sans-serif;font-variant-numeric:tabular-nums}.lx-unified-status .lx-time{position:absolute;left:38px;top:17px;letter-spacing:-.3px}.lx-unified-status .lx-system-icons{position:absolute;left:301px;top:17px;width:70px;height:14px}.lx-unified-status .lx-notch{position:absolute;left:135px;top:10px;width:120px;height:30px;background:#101010;border-radius:999px}.lx-unified-status canvas{position:absolute;left:0;top:0;width:390px;height:34px}.statusbar{display:none!important}';document.head.append(style);
const mount=()=>{const root=document.querySelector('.lx-device,#emergency,.saved-frame,.device .screen,#frame,.mr-phone');if(!root)return false;if(root.querySelector('.lx-unified-status'))return true;const b=document.createElement('div');b.className='lx-unified-status';b.setAttribute('aria-hidden','true');const raster=root.classList.contains('mr-phone');b.innerHTML=(raster?'<canvas width="390" height="34"></canvas>':'')+'<div class="lx-notch"></div><span class="lx-time"></span><svg class="lx-system-icons" viewBox="0 0 70 14" fill="none"><g fill="currentColor"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/><path d="M23 4.2a11 11 0 0 1 16 0l-2 2a8 8 0 0 0-12 0zm3 3a7 7 0 0 1 10 0l-2 2a4 4 0 0 0-6 0zm3 3a3 3 0 0 1 4 0l-2 2z"/><rect x="45" y="2.5" width="19" height="9" rx="1.5"/><path d="M68 5v4c1.5-.5 1.5-3.5 0-4"/></g><rect x="43" y="1" width="23" height="12" rx="3" stroke="currentColor" stroke-opacity=".5"/></svg>';root.append(b);if(root.id==='frame'){new MutationObserver(()=>{if(!b.isConnected)root.append(b)}).observe(root,{childList:true})}const time=()=>{const d=new Date();b.querySelector('.lx-time').textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')};time();setInterval(time,1000);
if(raster){const cv=b.querySelector('canvas'),ctx=cv.getContext('2d');let last=null;const cover=()=>{const active=root.querySelector('.mr-screen.on');if(!active)return;const imgs=[...active.querySelectorAll('img')];const im=imgs.filter(i=>i.complete&&i.naturalWidth&&getComputedStyle(i).opacity!=='0').at(-1);if(!im||im===last)return;last=im;try{ctx.drawImage(im,0,35*im.naturalHeight/844,im.naturalWidth,Math.max(1,im.naturalHeight/844),0,0,390,34)}catch{ctx.fillStyle='#352897';ctx.fillRect(0,0,390,34)}};cover();setInterval(cover,100)}
return true};if(!mount()){const o=new MutationObserver(()=>{if(mount())o.disconnect()});o.observe(document.body,{childList:true,subtree:true})}
})();</script></main><script type="module" src="script.js?v=undo13"></script></body></html>
