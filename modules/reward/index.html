<!doctype html>

</head>
<body>
<div id="stage" class="reward-stage">
  <main id="device" class="reward-device" aria-label="나의 밤하늘 리워드 보관함">
    <div class="sky" aria-hidden="true"></div>
    <div class="statusbar" aria-hidden="true">
      <span class="clock">9:41</span>
      <svg viewBox="0 0 68 15" width="70" height="16" fill="none" aria-hidden="true">
        <g fill="#F8F3E6"><rect x="0" y="10" width="3" height="4" rx="1"/><rect x="5" y="7" width="3" height="7" rx="1"/><rect x="10" y="4" width="3" height="10" rx="1"/><rect x="15" y="1" width="3" height="13" rx="1"/><path d="M23 5a11 11 0 0 1 16 0l-2 2a8 8 0 0 0-12 0zm3 3a7 7 0 0 1 10 0l-2 2a4 4 0 0 0-6 0zm3 3a3 3 0 0 1 4 0l-2 2z"/><rect x="46" y="3" width="18" height="9" rx="1.5"/></g><rect x="44" y="1.5" width="22" height="12" rx="3" stroke="#F8F3E6" stroke-opacity=".6"/>
      </svg>
    </div>
    <div id="gallery-shell">
    <header class="header">
      <button id="back" type="button" class="back-button" aria-label="이전 화면으로 돌아가기">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg>
      </button>
      <h1>나의 밤하늘</h1>
    </header>
    <div class="reward-meta">
      <span id="count" aria-live="polite">모은 리워드 5개</span>
      <button type="button" id="sort-toggle" class="sort-toggle" aria-haspopup="menu" aria-expanded="false">
        <span id="sort-label">오래된순</span>
        <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 5 5 5-5"/></svg>
      </button>
    </div>
    <p class="collection-caption">작은 용기가 모여 나만의 별자리가 돼요</p>
    <div id="reward-scroll" class="reward-scroll" role="region" tabindex="0" aria-label="별자리 리워드 목록. 세로 스크롤로 다른 리워드를 볼 수 있습니다.">
      <div class="constellation-track">
        <img class="trajectory" src="./art/trajectory.svg?v=reward-flow-20261125" alt="" draggable="false" width="350" height="1300">
        <div id="reward-hits" class="reward-hits"></div>
      </div>
    </div>
    <section id="empty-state" class="empty-state" hidden><img src="./art/reward-01.png" width="76" height="76" alt=""><h2>아직 연결되지 않은 밤하늘</h2><p>첫 미션을 마치면,<br>나만의 밤하늘에 첫 별이 생겨요.</p><button id="current-mission" class="history-button" type="button">현재 미션 확인하기</button></section>
    <div class="home-area" aria-hidden="true"><div class="home-indicator"></div></div>

    <div id="sort-menu" class="sort-menu" role="menu" aria-label="리워드 정렬 방식" hidden>
      <button type="button" role="menuitemradio" aria-checked="false" data-sort="newest">최신순 <span class="check" aria-hidden="true">✓</span></button>
      <button type="button" role="menuitemradio" aria-checked="true" data-sort="oldest">오래된순 <span class="check" aria-hidden="true">✓</span></button>
    </div>

    </div>

    <div id="modal-overlay" class="modal-overlay" hidden>
      <div class="modal-shade" data-dismiss="true"></div>
      <section class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <span id="detail-art-slot" class="detail-art-slot"><img id="detail-art" class="detail-art" src="./art/reward-05.png" width="76" height="76" alt=""></span>
        <p id="detail-number" class="detail-number">REWARD / 05</p>
        <h2 id="detail-title">첫마디 명사수</h2>
        <p id="detail-meaning" class="detail-meaning">먼저 인사를 건넨 용기를 기념해요</p>
        <div id="detail-mission" class="summary-box"><span class="detail-label">관련 미션</span><p id="mission-name">짧게 먼저 말 걸어보기</p></div>
        <div id="detail-summary" class="summary-box"><span id="summary-label" class="detail-label">미션 돌아보기</span><p id="summary-text"></p></div>
        <div class="detail-actions">
          <button id="show-history" class="history-button" type="button"><span>미션 회고 보기</span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
          <button id="close-detail" class="close-button" type="button">닫기</button>
        </div>
      </section>
    </div>

    <section id="history-view" class="history-view" role="dialog" aria-modal="true" aria-labelledby="history-title" hidden>
      <header class="header"><button type="button" id="close-history" class="back-button" aria-label="리워드 상세로 돌아가기"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg></button><h2 id="history-title">미션 돌아보기</h2></header>
      <div class="history-content">
        <p class="detail-number" id="history-number">REWARD / 05</p>
        <p id="record-source" class="record-source" hidden>예시 회고</p>
        <h3 id="record-title">먼저 건넨 한마디</h3>
        <p id="record-mission"></p>
        <div class="summary-box"><span class="detail-label">내가 남긴 회고</span><p id="record-reflection"></p></div>
        <div id="record-achievement-box" class="summary-box"><span class="detail-label">이번에 해낸 것</span><p id="record-achievement"></p></div>
        <div id="record-next-box" class="summary-box"><span class="detail-label">다음에 시도해 볼 것</span><p id="record-next"></p></div>
        <button type="button" id="return-to-detail" class="history-button">리워드로 돌아가기</button>
      </div>
      <div class="home-area" aria-hidden="true"><div class="home-indicator"></div></div>
    </section>
    <p id="toast" role="status" aria-live="polite" class="toast" hidden></p>

</div>
