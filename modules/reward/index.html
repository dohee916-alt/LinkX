<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#272342">
  <title>LinkX · 나의 밤하늘</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="stage" class="reward-stage">
  <main id="device" class="reward-device" aria-label="나의 밤하늘 리워드 보관함">
    <div class="sky" aria-hidden="true"></div>
    <div class="statusbar" aria-hidden="true">
      <span class="clock">9:41</span>
      <svg viewBox="0 0 68 15" width="70" height="16" fill="none" aria-hidden="true">
        <g fill="#F8F3E6"><rect x="0" y="10" width="3" height="4" rx="1"/><rect x="5" y="7" width="3" height="7" rx="1"/><rect x="10" y="4" width="3" height="10" rx="1"/><rect x="15" y="1" width="3" height="13" rx="1"/><path d="M23 5a11 11 0 0 1 16 0l-2 2a8 8 0 0 0-12 0zm3 3a7 7 0 0 1 10 0l-2 2a4 4 0 0 0-6 0zm3 3a3 3 0 0 1 4 0l-2 2z"/><rect x="46" y="3" width="18" height="9" rx="1.5"/></g><rect x="44" y="1.5" width="22" height="12" rx="3" stroke="#F8F3E6" stroke-opacity=".6"/>
      </svg>
    </div>
    <header class="header">
      <button id="back" type="button" class="back-button" aria-label="이전 화면으로 돌아가기">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg>
      </button>
      <h1>나의 밤하늘</h1>
    </header>
    <div class="reward-meta">
      <span id="count" aria-live="polite">모은 리워드 5개</span>
      <button type="button" id="sort-toggle" class="sort-toggle" aria-haspopup="menu" aria-expanded="false">
        <span id="sort-label">오래된순</span>
        <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 5 5 5-5"/></svg>
      </button>
    </div>
    <div id="reward-scroll" class="reward-scroll" role="region" tabindex="0" aria-label="별자리 리워드 목록. 세로 스크롤로 다른 리워드를 볼 수 있습니다.">
      <div class="constellation-track">
        <img id="constellation-art" src="./art/constellation-oldest.png" alt="" draggable="false" width="350" height="1120">
        <div id="reward-hits" class="reward-hits"></div>
      </div>
    </div>
    <div class="home-area" aria-hidden="true"><div class="home-indicator"></div></div>

    <div id="sort-menu" class="sort-menu" role="menu" aria-label="리워드 정렬 방식" hidden>
      <button type="button" role="menuitemradio" aria-checked="false" data-sort="newest">최신순 <span class="check" aria-hidden="true">✓</span></button>
      <button type="button" role="menuitemradio" aria-checked="true" data-sort="oldest">오래된순 <span class="check" aria-hidden="true">✓</span></button>
    </div>

    <div id="modal-overlay" class="modal-overlay" hidden>
      <div class="modal-shade" data-dismiss="true"></div>
      <section class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <div id="detail-art" class="detail-art" aria-hidden="true"></div>
        <h2 id="detail-title">05 · 첫마디의 발사</h2>
        <div id="detail-mission" class="detail-mission">
          <span class="detail-label">관련 미션</span>
          <span id="mission-name">짧게 먼저 말 걸어보기</span>
        </div>
        <div id="detail-summary" class="summary-box">
          <span class="detail-label">대화 요약</span>
          <p id="summary-text">대화 요약 데이터가 아직 연결되지 않았어요.</p>
        </div>
        <div class="detail-actions">
          <button id="show-history" class="history-button" type="button">대화 기록 보기 <span aria-hidden="true">›</span></button>
          <button id="close-detail" class="close-button" type="button">닫기</button>
        </div>
      </section>
    </div>

    <div id="history-view" class="history-view" hidden>
      <iframe id="feedback-frame" title="LinkX · 연습 로그" loading="lazy"></iframe>
      <button type="button" id="close-history" class="history-back" aria-label="리워드 화면으로 돌아가기">‹ <span>나의 밤하늘</span></button>
    </div>
    <p id="toast" role="status" aria-live="polite" class="toast" hidden></p>
  </main>
</div>
<script type="module" src="./script.js"></script>
</body>
</html>
