<meta name="theme-color" content="#202426">
<title>LinkX · 메인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ============================================================
   LinkX · Main (M02 / 메인 / 미션 완료 · 다음 미션 예고)
   기준: iPhone 13/14 · 390 × 844
   ============================================================ */
:root{
  --lx-w:390px; --lx-h:844px;
  --lx-ease:cubic-bezier(.2,.8,.2,1);
  --lx-page-ms:240ms;      /* W12: 페이지 전환 */
  --lx-press-ms:100ms;     /* W12: 버튼 눌림 */
  --lx-press-scale:.97;
  /* 컬러시스템.pdf 값 (플레이스홀더 화면에서만 사용) */
  --lx-black:#202426; --lx-cream:#F8F3E6; --lx-night:#352897; --lx-fade:#E0D7FC;
  --lx-font:"IBM Plex Sans KR","IBM Plex Sans",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  min-height:100vh; min-height:100dvh;
  display:flex; justify-content:center; align-items:flex-start;
  background:#0f1012; font-family:var(--lx-font);
  -webkit-tap-highlight-color:transparent;
}
@media (min-height:844px){ body{align-items:center} }

/* 기기 프레임: 정확히 390×844, 화면이 좁으면 JS가 --lx-scale로 축소 */
.lx-stage{width:calc(var(--lx-w) * var(--lx-scale,1));height:calc(var(--lx-h) * var(--lx-scale,1));flex:none}
.lx-device{
  position:relative; width:var(--lx-w); height:var(--lx-h);
  overflow:hidden; border-radius:44px; /* SVG 프레임 rx=30과 동일 */
  transform:scale(var(--lx-scale,1)); transform-origin:0 0;
  isolation:isolate;
}

/* ---------- 화면(라우트) ---------- */
.lx-screen{position:absolute;inset:0;visibility:hidden;will-change:transform}
.lx-screen.is-active{visibility:visible}
.lx-screen.is-animating{transition:transform var(--lx-page-ms) var(--lx-ease)}

/* ---------- 메인: SVG 원본 + 투명 터치 영역 ---------- */
.main-svg{position:absolute;left:0;top:0;width:390px;height:844px;display:block}
.svg-btn{transform-box:fill-box;transform-origin:center;transition:transform var(--lx-press-ms) ease-out}
.svg-btn.is-pressed{transform:scale(var(--lx-press-scale))}

.lx-hit{
  position:absolute; margin:0; padding:0; border:0; background:transparent;
  cursor:pointer; touch-action:manipulation; -webkit-appearance:none; appearance:none;
}
.lx-hit:focus{outline:none}
.lx-hit:focus-visible{outline:2px solid var(--lx-cream);outline-offset:3px}
/* 좌표·크기·반경은 SVG(메인 프레임 기준 x-47, y-604) 값을 그대로 사용 */
.lx-hit--reward  {left:20px; top:418px;width:350px;height:104px;border-radius:20px}
.lx-hit--fire    {left:328px;top:300px;width:44px; height:44px; border-radius:50%}
.lx-hit--star    {left:328px;top:354px;width:44px; height:44px; border-radius:50%}
.lx-hit--certify {left:41px; top:655px;width:147px;height:48px; border-radius:24px}
.lx-hit--practice{left:200px;top:655px;width:147px;height:48px; border-radius:24px}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 임시 플레이스홀더(팀 통합 대기) ---------- */
.lx-ph{background:var(--lx-black);color:var(--lx-cream);display:flex;flex-direction:column;padding:62px 20px 40px}
.lx-ph__top{display:flex;align-items:center;gap:12px;min-height:44px}
.lx-back{
  display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:22px;
  border:1.5px solid rgba(248,243,230,.4);background:transparent;color:var(--lx-cream);
  font:600 15px/1 var(--lx-font);cursor:pointer;
  transition:transform var(--lx-press-ms) ease-out;
}
.lx-back:focus{outline:none}
.lx-back:focus-visible{outline:2px solid var(--lx-cream);outline-offset:3px}
.lx-back.is-pressed{transform:scale(var(--lx-press-scale))}
.lx-ph__badge{
  align-self:flex-start;margin-top:28px;padding:4px 10px;border-radius:6px;
  border:1px dashed rgba(248,243,230,.6);font:600 12px/18px var(--lx-font);
}
.lx-ph h1{margin:16px 0 8px;font:600 24px/32px var(--lx-font)}
.lx-ph p{margin:0 0 6px;font:400 14px/21px var(--lx-font);color:rgba(248,243,230,.75)}
.lx-ph dl{margin:20px 0 0;padding:16px;border-radius:12px;background:rgba(248,243,230,.06);border:1px solid rgba(248,243,230,.14)}
.lx-ph dt{font:600 12px/18px var(--lx-font);color:rgba(248,243,230,.6)}
.lx-ph dd{margin:0 0 12px;font:400 14px/21px var(--lx-font);word-break:keep-all}
.lx-ph dd:last-child{margin-bottom:0}
.lx-ph code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

@media (prefers-reduced-motion: reduce){
  .lx-screen.is-animating,.svg-btn,.lx-back{transition:none}
}
</style>

<script>
/* ============================================================
   LinkX 라우터 (팀 Single HTML 통합용)
   - window.LinkX.go(route) / back() / register(route, el)
   - 해시: #/main, #/reward, #/fire, #/star, #/mission-certify, #/practice
   ============================================================ */
(function(){
  'use strict';
  var app = document.getElementById('lx-app');
  var stage = document.getElementById('lx-stage');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var PAGE_MS = 240;

  /* Figma 프로토타입에서 확인한 상태값 (M02 프레임 752:112752) */
  var state = {
    'example/acquiredCount': 3,          /* 변수 기본값 3 · 대표 리워드 클릭 조건(1/3/8) */
    'mission/practiceContext': null,     /* '지금 연습하기' 클릭 시 설정 */
    'mission/practiceTitle': null
  };

  /* ---- 아직 개발되지 않은 화면: 임시 플레이스홀더 ---- */
  var PLACEHOLDERS = {
    'reward': {
      title: '리워드 (나의 밤하늘)',
      from: '대표 리워드 카드 · 작은 호감',
      figma: 'ON_CLICK → 조건 분기: example/acquiredCount 가 1 / 3 / 8 일 때 각각 NAVIGATE. 세 분기 모두 이동 대상 프레임이 비어 있음.',
      next: '리워드 보관함 화면 담당자 화면으로 교체'
    },
    'fire': {
      title: '불꽃 아이콘 기능',
      from: '오른쪽 위 버튼 (44×44)',
      figma: '프로토타입 연결 없음 · 기능 정의 [자료 없음]',
      next: '팀에서 기능 정의 후 연결'
    },
    'star': {
      title: '별 아이콘 기능',
      from: '오른쪽 아래 버튼 (44×44)',
      figma: '프로토타입 연결 없음 · 기능 정의 [자료 없음]',
      next: '팀에서 기능 정의 후 연결'
    },
    'mission-certify': {
      title: '미션 인증하기',
      from: '진행 중인 미션 카드 · 왼쪽 버튼',
      figma: '프로토타입 연결 없음 · 인증 방식 [자료 없음]',
      next: '미션 완료 · 피드백/리워드 흐름 담당자 화면으로 교체'
    },
    'practice': {
      title: 'AI 연습 (지금 연습하기)',
      from: '진행 중인 미션 카드 · 오른쪽 버튼',
      figma: 'ON_CLICK → SET mission/practiceContext = "현재 미션 연습", SET mission/practiceTitle = "짧게 먼저 말 걸어보기". 화면 이동 대상은 설정되어 있지 않음.',
      next: '대화창(텍스트/롤플레잉) 담당자 화면으로 교체 · 위 두 값을 읽어 시작'
    }
  };

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function buildPlaceholder(route, d){
    var s = document.createElement('section');
    s.className = 'lx-screen lx-ph';
    s.dataset.route = route;
    s.dataset.placeholder = 'true';
    s.setAttribute('aria-labelledby', 'ph-title-' + route);
    s.innerHTML =
      '<div class="lx-ph__top"><button type="button" class="lx-back" data-back>‹ 메인으로</button></div>' +
      '<span class="lx-ph__badge">임시 화면 · 팀 통합 대기 (待团队整合)</span>' +
      '<h1 id="ph-title-' + route + '">' + esc(d.title) + '</h1>' +
      '<p>이 화면은 아직 연결되지 않았습니다. 메인 버튼 동작 확인용 임시 화면입니다.</p>' +
      '<dl>' +
        '<dt>진입 버튼</dt><dd>' + esc(d.from) + '</dd>' +
        '<dt>Figma 프로토타입 기록</dt><dd>' + esc(d.figma) + '</dd>' +
        '<dt>라우트</dt><dd><code>#/' + route + '</code></dd>' +
        '<dt>통합 시 할 일</dt><dd>' + esc(d.next) + '</dd>' +
        (route === 'practice' ? '<dt>현재 전달된 값</dt><dd data-practice-state></dd>' : '') +
        (route === 'reward' ? '<dt>현재 전달된 값</dt><dd>example/acquiredCount = ' + state['example/acquiredCount'] + '</dd>' : '') +
      '</dl>';
    app.appendChild(s);
    return s;
  }
  Object.keys(PLACEHOLDERS).forEach(function(r){ buildPlaceholder(r, PLACEHOLDERS[r]); });

  /* ---- 화면 조회 / 전환 ---- */
  function screen(route){ return app.querySelector('.lx-screen[data-route="' + route + '"]'); }
  var current = 'main';
  var busy = false;

  function show(to, dir, done){
    var fromEl = screen(current), toEl = screen(to);
    if (!toEl || to === current){ done && done(); return; }
    if (reduce.matches){
      fromEl.classList.remove('is-active');
      toEl.classList.add('is-active');
      current = to; afterShow(toEl); done && done(); return;
    }
    busy = true;
    toEl.style.transform = 'translateX(' + (dir > 0 ? '100%' : '-100%') + ')';
    toEl.classList.add('is-active');
    void toEl.offsetWidth;                         /* 시작 위치 확정 */
    fromEl.classList.add('is-animating'); toEl.classList.add('is-animating');
    toEl.style.transform = 'translateX(0)';
    fromEl.style.transform = 'translateX(' + (dir > 0 ? '-100%' : '100%') + ')';
    var finished = false;
    function end(){
      if (finished) return; finished = true;
      fromEl.classList.remove('is-active','is-animating'); toEl.classList.remove('is-animating');
      fromEl.style.transform = ''; toEl.style.transform = '';
      current = to; busy = false; afterShow(toEl); done && done();
    }
    toEl.addEventListener('transitionend', function h(e){ if (e.target === toEl){ toEl.removeEventListener('transitionend', h); end(); } });
    setTimeout(end, PAGE_MS + 80);                 /* transitionend 누락 대비 */
  }

  function afterShow(el){
    if (el.dataset.route === 'practice'){
      var dd = el.querySelector('[data-practice-state]');
      if (dd) dd.textContent = 'practiceContext = "' + state['mission/practiceContext'] + '", practiceTitle = "' + state['mission/practiceTitle'] + '"';
    }
    var focusTarget = el.querySelector('[data-back]') || el.querySelector('.lx-hit');
    if (focusTarget && document.activeElement && document.activeElement !== document.body) focusTarget.focus({preventScroll:true});
  }

  /* ---- 히스토리 (브라우저 뒤로가기와 동일한 역방향 전환) ---- */
  function routeFromHash(){ var m = location.hash.match(/^#\/([\w-]+)/); return m && screen(m[1]) ? m[1] : 'main'; }
  function go(route){
    if (busy || route === current || !screen(route)) return;
    var destinations={fire:'../emergency/index.html',star:'../saved/index.html?tab=saved',practice:'../textmode/index.html', 'mission-certify':'../textmode/index.html?entry=certify'};
    if(destinations[route]){sessionStorage.setItem('linkx:practiceContext',state['mission/practiceContext']||'');sessionStorage.setItem('linkx:practiceTitle',state['mission/practiceTitle']||'');location.href=destinations[route];return;}
    history.pushState({lx: route, depth: (history.state && history.state.depth || 0) + 1}, '', '#/' + route);
    show(route, +1);
  }
  function back(){
    if (busy) return;
    if (history.state && history.state.depth > 0) history.back();
    else { history.replaceState({lx:'main', depth:0}, '', '#/main'); show('main', -1); }
  }
  window.addEventListener('popstate', function(){
    var to = routeFromHash();
    if (to === current) return;
    show(to, to === 'main' ? -1 : +1);
  });

  /* ---- 버튼 눌림 피드백 scale(.97) 100ms ---- */
  function pressTarget(btn){
    return btn.dataset.press ? document.getElementById(btn.dataset.press) : btn;
  }
  function setPressed(btn, on){ var t = pressTarget(btn); if (t) t.classList.toggle('is-pressed', on); }
  app.addEventListener('pointerdown', function(e){ var b = e.target.closest('.lx-hit,.lx-back'); if (b) setPressed(b, true); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){
    app.addEventListener(t, function(e){ var b = e.target.closest('.lx-hit,.lx-back'); if (b) setPressed(b, false); }, true);
  });
  app.addEventListener('keydown', function(e){ var b = e.target.closest('.lx-hit,.lx-back'); if (b && (e.key === 'Enter' || e.key === ' ')) setPressed(b, true); });
  app.addEventListener('keyup',   function(e){ var b = e.target.closest('.lx-hit,.lx-back'); if (b) setPressed(b, false); });

  /* ---- 클릭 동작 ---- */
  app.addEventListener('click', function(e){
    var hit = e.target.closest('.lx-hit');
    if (hit){
      if (hit.dataset.go === 'practice'){           /* Figma와 같은 변수 설정 */
        state['mission/practiceContext'] = '현재 미션 연습';
        state['mission/practiceTitle'] = '짧게 먼저 말 걸어보기';
      }
      go(hit.dataset.go); return;
    }
    if (e.target.closest('[data-back]')) back();
  });

  /* ---- 390 미만 화면: 가로 스크롤 없이 축소 ---- */
  function fit(){
    var s = Math.min(1, document.documentElement.clientWidth / 390, window.innerHeight / 844);
    stage.style.setProperty('--lx-scale', s);
    app.style.setProperty('--lx-scale', s);
  }
  window.addEventListener('resize', fit); fit();

  /* ---- 초기 라우트 ---- */
  history.replaceState({lx:'main', depth:0}, '', '#/main');

  /* ---- 팀 통합용 공개 API ---- */
  window.LinkX = {
    state: state,
    go: go,
    back: back,
    current: function(){ return current; },
    /* 다른 조원 화면으로 플레이스홀더 교체: LinkX.register('reward', sectionElement) */
    register: function(route, el){
      var old = screen(route);
      el.classList.add('lx-screen'); el.dataset.route = route;
      if (old) old.replaceWith(el); else app.appendChild(el);
    },
    placeholders: Object.keys(PLACEHOLDERS)
  };
})();
</script>
</body>
</html>
