<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#352897"><title>LinkX · 메인</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body,html{margin:0}body{background:#f3eff9;color:#594a91;font-family:"IBM Plex Sans KR",system-ui,"Noto Sans KR",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 0 22px}
#phone{position:relative;isolation:isolate;width:390px;height:844px;flex:none;overflow:hidden;border-radius:32px;background:linear-gradient(180deg,#352897 19.83%,#9180c3 69.4%,#e0d7fc 100%)}
#phone img{position:absolute;display:block;max-width:none;pointer-events:none;user-select:none}
#stars{z-index:0}#mascot{z-index:3;opacity:.9;mask-image:linear-gradient(to bottom,#000 0%,#000 46%,#000d 68%,#0001 99%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 46%,#000d 68%,#0001 99%)}#status,#brand,#home,#proto{z-index:8}
#underglow,#line,#small,#dots,#ring,#big,#halo{z-index:5}
#underglow,#line{opacity:0;clip-path:inset(0 100% 0 0);animation:lineTrace .86s .18s both cubic-bezier(.22,.74,.3,1)}
#line{animation-delay:.3s}
@keyframes lineTrace{0%{clip-path:inset(0 100% 0 0);opacity:0}20%{opacity:1}100%{clip-path:inset(0 0 0 0);opacity:1}}
#small{opacity:0;transform-origin:center;animation:starIlluminate .72s .92s both cubic-bezier(.2,.75,.27,1)}
@keyframes starIlluminate{0%{opacity:0;transform:scale(.65);filter:brightness(1.3)}61%{opacity:1;transform:scale(1.11);filter:brightness(1.25)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
#dots{opacity:0;clip-path:inset(100% 0 0 0);animation:dotsDraw 1.16s 1.22s both cubic-bezier(.2,.7,.2,1)}
@keyframes dotsDraw{0%{opacity:0;clip-path:inset(100% 0 0 0)}18%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0)}}
#ring,#big,#halo{opacity:0;transform-origin:center;animation:orbitBloom .86s 1.94s both cubic-bezier(.2,.8,.3,1)}
#halo{animation-delay:1.72s}#ring{animation-delay:1.85s}#big{animation-delay:1.99s}
@keyframes orbitBloom{0%{opacity:0;transform:scale(.95);filter:brightness(1.25)}60%{opacity:1;transform:scale(1.018)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
.copyArt{z-index:10;opacity:0;animation:copyRise .92s 2.28s both cubic-bezier(.16,.78,.27,1)}
@keyframes copyRise{0%{opacity:0;transform:translateY(23px);filter:blur(3px)}65%{opacity:1;transform:translateY(-3px);filter:blur(0)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
.buttonArt{z-index:11;opacity:0;animation:buttonRise .83s 2.57s both cubic-bezier(.16,.79,.26,1)}
.buttonArt.low{animation-delay:2.72s}
@keyframes buttonRise{0%{opacity:0;transform:translateY(17px)}69%{opacity:1;transform:translateY(-2px)}100%{opacity:1;transform:translateY(0)}}
#phone[data-stage="first"] .secondArt,#phone[data-stage="second"] .firstArt{display:none}
.glow{position:absolute;z-index:14;opacity:0;pointer-events:none}
#glowPractice{left:5px;top:625px;width:382px;height:136px}
#glowEmergency{left:5px;top:691px;width:382px;height:136px}
.glow img{left:0;top:0;width:382px;height:136px}
#phone[data-stage="first"] #glowPractice,#phone[data-stage="second"] #glowEmergency{animation:glowFromNone 1.44s 3.25s ease-in-out infinite}
@keyframes glowFromNone{0%,18%,100%{opacity:0}44%{opacity:.72}61%{opacity:1}77%{opacity:.26}90%{opacity:0}}
.mainbtn{position:absolute;left:45px;width:302px;height:56px;border:0;padding:0;margin:0;border-radius:999px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:30;touch-action:manipulation;transition:background-color .08s ease-out,box-shadow .08s ease-out}
#practice{top:665px}#emergency{top:731px}
.mainbtn:active,.mainbtn.pressed{background:rgba(32,36,38,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.mainbtn:focus-visible,#bookmark:focus-visible{outline:2px solid #e0d7fc;outline-offset:2px}
#bookmark{position:absolute;left:334px;top:59px;width:40px;height:43px;z-index:31;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

#screen{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;padding:62px 27px 48px;color:white;background:linear-gradient(170deg,#352897,#705bb4 54%,#dccff2);animation:sceneIn .35s both}
#screen.open{display:flex}@keyframes sceneIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
#back{width:42px;height:42px;background:#ffffff23;color:white;border:1px solid #fff6;border-radius:50%;font-size:26px;cursor:pointer}
#label{font-size:11px;letter-spacing:.2em;margin:84px 0 11px;opacity:.85}
#heading{font-size:24px;line-height:1.45;margin:0}
#message{white-space:pre-line;font-size:14px;line-height:1.85;margin:20px 0}
#advance{margin-top:auto;width:100%;height:56px;border-radius:999px;border:1px solid #fff9;color:#49358f;font-size:16px;font-weight:700;background:linear-gradient(110deg,#e1d2f3,#f9f4ff);cursor:pointer}
#advance:active{background:#d1c2eb;box-shadow:inset 0 0 0 1px #fff6}
#progress{font-size:11px;margin-top:16px;opacity:.77}
#controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}
#controls button{border:1px solid #aa9ecc;padding:9px 13px;background:#fff;color:#4a3c8e;border-radius:19px;font-size:12px;cursor:pointer}
#controls button.chosen{background:#534194;color:#fff}
#footnote{text-align:center;font-size:11px;color:#8a7ba5;margin:10px auto 0}
@media(prefers-reduced-motion:reduce){.animate,.glow{animation-duration:.01ms!important;animation-delay:0ms!important}}

/* v7: restore exact Figma #1980 core diamond and #1985 inner orbit ring */
#smallCore,#innerHalo{position:absolute;display:block;pointer-events:none;user-select:none;z-index:5;max-width:none}
#smallCore{opacity:0;transform-origin:center;animation:starIlluminateQuick .53s .64s both cubic-bezier(.2,.75,.27,1)}
#small{animation:starIlluminateQuick .53s .59s both cubic-bezier(.2,.75,.27,1)}
@keyframes starIlluminateQuick{0%{opacity:0;transform:scale(.72);filter:brightness(1.2)}68%{opacity:1;transform:scale(1.06);filter:brightness(1.1)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
#underglow{animation:lineTraceQuick .62s .11s both cubic-bezier(.22,.74,.3,1)}
#line{animation:lineTraceQuick .62s .18s both cubic-bezier(.22,.74,.3,1)}
@keyframes lineTraceQuick{0%{opacity:0;clip-path:inset(0 100% 0 0)}18%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0)}}
#dots{animation:dotsDrawQuick .82s .78s both cubic-bezier(.2,.7,.2,1)}
@keyframes dotsDrawQuick{0%{opacity:0;clip-path:inset(100% 0 0 0)}16%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0)}}
#halo,#innerHalo,#ring,#big{opacity:0;transform-origin:center;animation:orbitBloomQuick .68s 1.34s both cubic-bezier(.2,.8,.3,1)}
#innerHalo{animation-delay:1.40s}
#ring{animation-delay:1.45s}
#big{animation-delay:1.50s}
@keyframes orbitBloomQuick{0%{opacity:0;transform:scale(.956);filter:brightness(1.15)}66%{opacity:1;transform:scale(1.012)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
.copyArt{animation-delay:1.97s}
.buttonArt{animation-delay:2.23s}
.buttonArt.low{animation-delay:2.38s}
/* Figma icon bounding box (341,68,25,24), no rectangular pressed area */
#bookmark{left:334px;top:61px;width:40px;height:40px}
#bookmark::after{left:7px;top:7px;width:26px;height:25px}

/* Use exact exported Figma masked mascot group including radial soft-alpha falloff */
#mascot{left:0!important;top:92px!important;width:390px!important;height:438px!important;opacity:1!important;mask-image:none!important;-webkit-mask-image:none!important;z-index:3}
#stageCaption{z-index:7;opacity:1;position:absolute;pointer-events:none;user-select:none}

/* Caption follows the illumination of the small (04) star, not the initial frame. */
#stageCaption{
  opacity:0;
  transform:translateY(3px);
  animation:stageCaptionAfterStar .44s .82s both cubic-bezier(.22,.8,.24,1);
}
@keyframes stageCaptionAfterStar{
  0%{opacity:0;transform:translateY(3px);filter:blur(1.6px)}
  55%{opacity:.66;filter:blur(.5px)}
  100%{opacity:1;transform:translateY(0);filter:blur(0)}
}


/* GitHub production home: use the existing 390x844 device geometry. */
html,body{margin:0!important;width:100%;height:100%;min-height:100%;overflow:hidden!important}
body{display:flex!important;align-items:center!important;justify-content:center!important;padding:0!important;background:#0f1012!important;font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif!important}
#lx-wrap{width:calc(390px * var(--lx-scale,1));height:calc(844px * var(--lx-scale,1));flex:none;position:relative}
#phone{width:390px!important;height:844px!important;transform:scale(var(--lx-scale,1));transform-origin:0 0;border-radius:44px!important}
#controls,#preview,#footnote,#caption{display:none!important}
/* Figma-masked mascot exported WITHOUT its tiny rasterized caption; real text remains crisp. */
#mascot{left:0!important;top:92px!important;width:390px!important;height:438px!important;opacity:1!important;mask:none!important;-webkit-mask:none!important}
#prototypeLive{position:absolute;z-index:8;left:231px;top:164px;width:125px;height:38px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:10px;font-weight:400;line-height:16px;white-space:pre-line;letter-spacing:0;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;pointer-events:none}
/* Replace only the low-res lettering inside the transparent 305x110 mission cutout.

#copyA,#copyB{clip-path:inset(0 214px 0 0)}
#missionLive{position:absolute;z-index:10;left:133px;top:555px;width:242px;height:82px;color:#f8f3e6;opacity:0;pointer-events:none;animation:copyRise .92s 1.97s both cubic-bezier(.16,.78,.27,1);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
#phone[data-stage="second"] #missionLive{left:136px;top:554.7px}

#missionLive .mission-title{position:absolute;top:22px;left:0;white-space:nowrap;color:#f8f3e6;font-size:19px;font-weight:700;line-height:22px;letter-spacing:-.03em}
#missionLive .mission-detail{position:absolute;top:52px;left:0;margin:0;white-space:nowrap;color:#f8f3e6;font-size:15px;font-weight:500;line-height:22px;letter-spacing:-.025em}

<div id="prototypeLive" aria-label="프로토타입용으로 연출된 화면입니다">프로토타입용으로
연출된 화면입니다</div>
<button id="practice" class="mainbtn" type="button" aria-label="연습하러 가기"></button>
<button id="emergency" class="mainbtn" type="button" aria-label="직접 하러 가보자!"></button>
<button id="bookmark" type="button" aria-label="북마크 페이지"></button>

</main></div><script>
(function(){
 'use strict';
 const $=id=>document.getElementById(id),phone=$('phone'),root=$('lx-wrap');
 const KEY='linkx:homeStage';
 const query=new URLSearchParams(location.search);
 function getStage(){const v=query.get('stage')||sessionStorage.getItem(KEY)||'first';return v==='second'?'second':'first'}
 let stage=getStage();
 function replay(){
   phone.querySelectorAll('.animate,.glow').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''});
   for(const id of ['missionLive','stageCaptionLive']){const el=$(id);el.style.animation='none';void el.offsetWidth;el.style.animation=''}
 }
 function setStage(next,again){
   stage=next==='second'?'second':'first';phone.dataset.stage=stage;sessionStorage.setItem(KEY,stage);
   if(again)replay();
 }
 function navigateTo(kind){
   const destinations={
     saved:{item:['저장목록','modules/saved/index.html','?tab=saved','저장목록'],fallback:'../saved/index.html?tab=saved'},
     text:{item:['텍스트 모드 · 피드백','modules/textmode/index.html','5','텍스트 대화'],fallback:'../textmode/index.html'},
     emergency:{item:['긴급대화','modules/emergency/index.html','','긴급대화'],fallback:'../emergency/index.html'}
   };
   const target=destinations[kind];if(!target)return;
   // Enter the prepared feedback state directly; the outer navigator's F.go(5)
   // would otherwise overwrite entry=practice and restart scenario selection.
   if(kind==='text' && sessionStorage.getItem('linkx:guidedFlow')==='practice'){
     try {
       if(window.parent!==window && typeof window.parent.choose==='function') {
         window.parent.choose(['텍스트 모드 · 피드백','modules/textmode/index.html','5','텍스트 대화']);
         return;
       }
     } catch(e) {}
     window.location.assign('../textmode/index.html?n=5&v=original-sidebar-02&restart='+Date.now());
     return;
   }
   try{
     if(window.parent&&window.parent!==window&&typeof window.parent.choose==='function'){
       window.parent.choose(target.item);return;
     }
   }catch(e){}
   window.location.assign(target.fallback);
 }
 function press(button,callback){
   if(button.classList.contains('pressed'))return;
   button.classList.add('pressed');
   setTimeout(()=>{button.classList.remove('pressed');if(callback)callback()},140);
 }
 $('bookmark').addEventListener('click',()=>press($('bookmark'),()=>navigateTo('saved')));
 $('practice').addEventListener('click',()=>press($('practice'),()=>{
   if(stage!=='first')return;
   // The second home is unlocked only AFTER feedback, never upon entering practice.
   sessionStorage.setItem(KEY,'first');
   sessionStorage.setItem('linkx:guidedFlow','practice');
   sessionStorage.setItem('linkx:practiceContext','현재 미션 연습');
   sessionStorage.setItem('linkx:practiceTitle','짧게 먼저 말 걸어보기');
   navigateTo('text');
 }));
 $('emergency').addEventListener('click',()=>press($('emergency'),()=>{
   if(stage==='second')navigateTo('emergency');
 }));
 function fit(){
   // Never scale the inner phone. The outer exhibition iframe already scales it.
   root.style.setProperty('--lx-scale','1');
   phone.style.transform='none';
   if(window.parent===window){
     root.style.zoom=String(Math.max(.1,Math.min(1,window.innerWidth/390,window.innerHeight/844)));
   }else root.style.zoom='1';
 }
 function fitTextToViewport(){
   const box=$('missionLive'),left=parseFloat(getComputedStyle(box).left)||133;
   const available=390-left-11;
   const ratio=phone.getBoundingClientRect().width/390||1;
   for(const [selector,base,minimum] of [['.mission-title',19,16],['.mission-detail',15,12.5],['.mission-state',10.6,9]]){
     const el=box.querySelector(selector);
     if(!el)continue;
     el.style.fontSize=base+'px';
     const range=document.createRange();
     range.selectNodeContents(el);
     let width=range.getBoundingClientRect().width/ratio;
     if(width>available){
       const scaled=Math.max(minimum,base*(available-2)/width);
       el.style.fontSize=scaled.toFixed(2)+'px';
     }
   }
 }
 addEventListener('resize',()=>{fit();fitTextToViewport()});
 fit();setStage(stage,false);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTextToViewport);
 fitTextToViewport();
 window.LinkXHome={current:()=>stage,showStage:(next)=>setStage(next,true),replay};
})();
</script></body></html>
