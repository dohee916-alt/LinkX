<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"><title>LinkX · 긴급대화</title><link rel="stylesheet" href="../../shared/tokens.css"><link rel="stylesheet" href="style.css?v=20261118-final9"></head>
<body class="lx-emergency-page"><main id="emergency" class="lx-emergency" aria-label="긴급대화">
<canvas id="diamond-glow" class="lx-diamond-glow" width="390" height="844" aria-hidden="true" hidden></canvas><div class="lx-status-reserved" aria-hidden="true"></div><div class="lx-emergency__stars" aria-hidden="true"></div>
<nav class="lx-nav"><button id="back" aria-label="뒤로가기" class="lx-icon"><img src="../../assets/emergency/back.svg" alt=""></button><button id="saved" aria-label="저장목록" class="lx-icon"><img src="../../assets/emergency/star.svg" alt=""></button></nav>
<img class="lx-long-character" src="../../assets/emergency/character.png" alt="" aria-hidden="true"><section id="chat" class="lx-chat" aria-label="대화 기록" tabindex="0"><div id="messages" class="lx-messages"></div></section>
<section id="ready-area" class="lx-ready-area"><img class="lx-line" src="../../assets/emergency/line.svg" alt=""><div id="ready-motion"><button id="ready" class="lx-primary lx-ready"><img class="lx-flame" src="../../assets/emergency/flame.svg" alt=""><span class="lx-ready-label lx-vector-label">준비됐어!</span></button></div></section>
<form id="composer" class="lx-composer"><button type="button" id="mic" class="lx-icon" aria-label="음성 입력"><img src="../../assets/emergency/mic.svg" alt=""></button><textarea id="message" rows="1" inputmode="text" autocomplete="off" placeholder="메세지를 입력하세요." aria-label="메세지 입력" enterkeyhint="send"></textarea><button id="send" type="submit" class="lx-send" aria-label="전송"><img src="../../assets/emergency/send.svg" alt=""></button></form>
<section id="departure" class="lx-departure" hidden><div class="lx-breath"><img class="lx-echo" src="../../assets/emergency/echo.svg" alt=""><img class="lx-depart-character" src="../../assets/emergency/departure.png" alt=""></div><h1 id="departure-title">이제 진짜 가보자</h1><p>잘 해낼거야. 우리 연습을 믿어.<br>심호흡 한 번 하고 출발하자!</p><button id="returned" class="lx-primary"><span class="lx-vector-label">다녀왔어!</span></button></section>
<div id="confirm" class="lx-overlay" hidden><div class="lx-confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><img src="../../assets/emergency/confirm.png" alt=""><div class="lx-confirm-panel"><h2 id="confirm-title">정말 지금 안 할 거야?</h2><div><button id="leave" class="lx-primary lx-secondary"><span class="lx-vector-label">다음에 할래</span></button><button id="continue" class="lx-primary"><img class="lx-flame" src="../../assets/emergency/flame.svg" alt=""><span class="lx-vector-label">지금 할래</span></button></div></div></div></div>
<div id="preview-keyboard" hidden aria-label="키보드 미리보기"><img src="../../assets/emergency/keyboard.svg" alt=""><div id="keyboard-keys"></div></div><div id="notice" role="status" class="lx-notice" hidden></div>
</main><script type="module" src="script.js?v=20261118-final9"></script></body></html>
