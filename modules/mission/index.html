<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LinkX · 미션, 리워드 구동</title>
<style>html,body{margin:0;height:100%;overflow:hidden}
/* LinkX · 미션, 리워드 구동 — 390 × 844 (iPhone 13/14) */
.mr-root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#15161a;font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif}
.mr-phone{position:relative;width:390px;height:844px;flex:none;border-radius:44px;overflow:hidden;background:#202426;box-shadow:0 30px 80px rgba(0,0,0,.45);transform-origin:center center}
@media (max-width:430px){.mr-phone{border-radius:0;box-shadow:none}}
.mr-screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition-property:opacity}
.mr-screen.on{opacity:1;pointer-events:auto}
.mr-screen img{display:block;width:390px;height:844px;user-select:none;-webkit-user-drag:none}
.mr-hot{position:absolute;border:0;padding:0;margin:0;background:transparent;cursor:pointer;border-radius:999px;-webkit-tap-highlight-color:transparent}
.mr-hot{transition:background-color .08s ease-out,box-shadow .08s ease-out}
.mr-hot:active,.mr-hot.pressed{background:rgba(32,36,38,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.mr-hot:focus-visible{outline:2px solid #E0D7FC;outline-offset:2px}
.mr-dev{position:fixed;left:16px;top:16px;display:flex;gap:8px;z-index:10}
.mr-dev button{font:500 12px/1 inherit;font-family:inherit;color:#E0D7FC;background:rgba(53,40,151,.5);border:1px solid rgba(224,215,252,.35);border-radius:16px;padding:8px 12px;cursor:pointer}
@media (max-width:600px){.mr-dev{display:none}}
.mr-anim.on{pointer-events:auto}
.mr-stack{position:absolute;inset:0}
.mr-stack img{position:absolute;inset:0;width:390px;height:844px;opacity:0;will-change:opacity}
</style>
</head>
<body>
<div id="mr-root" class="mr-root"></div>
<script>window.MR_ASSETS={};</script><script src="assets-0.js"></script><script src="assets-1.js"></script><script src="assets-2.js"></script><script src="assets-3.js"></script><script src="assets-4.js"></script><script src="assets-5.js"></script><script src="assets-6.js"></script><script src="assets-7.js"></script><script src="assets-8.js"></script><script src="assets-9.js"></script><script src="assets-10.js"></script><script src="assets-11.js"></script><script src="assets-12.js"></script><script src="assets-13.js"></script><script src="assets-14.js"></script><script>window.MR_ANIM_COUNTS={"reward-1_to_2": 10, "next-quest-1_to_2": 8, "next-quest-6_to_7": 11, "reward-2_to_2-1": 13, "next-quest-2_to_3": 8, "next-quest-5_to_6": 7, "quest-01-2_to_3": 10, "next-quest-3_to_4": 8, "quest-01-1_to_2": 9};</script>
<script>
/* LinkX · 미션, 리워드 구동
 * 흐름 1  #mission : 미션 팝업 → 첫 미션 부여 → 메인
 * 흐름 2  #reward  : 리워드 팝업 → 미션 완료 후 리워드 제공 → (리워드 확인하기 | 메인 | 미션 완료 후 새 미션 부여 → 메인)
 * 좌표·시간은 피그마 「G_화면 디자인 최종 / 구동용 페이지」 값 (390 × 844 기준)
 */
(function(){
'use strict';
const ASSET_BASE = (window.MR_ASSET_BASE !== undefined) ? window.MR_ASSET_BASE : 'assets/';
const ASSETS = window.MR_ASSETS || {};           // 한 파일 빌드에서 data URI로 채워짐
const src = id => ASSETS[id] || (ASSET_BASE + id + '.png');

// e: 'ease-out' | 'ease-in-out' | 'linear'
const S = {
  // ── 흐름 1 · 미션 팝업 (피그마: 미션, 리워드 / 미션 팝업)
  'chat-mission-01': {hot:[{r:[112,96,270,46], go:'chat-mission-02', t:.24, e:'ease-out', a:'새 미션 알림 열기', rad:15}]},
  'chat-mission-02': {hot:[{r:[347,108,22,22], go:'chat-mission-01', t:.20, e:'ease-out', a:'닫기', pad:11},
                           {r:[127,155,242,34], go:'quest-01-1', t:.28, e:'ease-out', a:'확인하러 가기'}]},
  // ── 첫 미션 부여
  'quest-01-1': {g:'quest', auto:{after:.05, go:'quest-01-2', t:.33, e:'ease-in-out'}},
  'quest-01-2': {g:'quest', auto:{after:.05, go:'quest-01-3', t:.38, e:'ease-in-out'}},
  'quest-01-3': {g:'quest', hot:[{r:[28,719,334,56], go:'main', t:.28, e:'ease-out', a:'미션 확인 완료'}]},
  // ── 흐름 2 · 리워드 팝업 (피그마: 미션, 리워드 / 리워드 팝업)
  'chat-done-01': {hot:[{r:[112,96,270,46], go:'chat-done-02', t:.24, e:'ease-out', a:'리워드 알림 열기', rad:15}]},
  'chat-done-02': {hot:[{r:[347,108,22,22], go:'chat-done-01', t:.20, e:'ease-out', a:'닫기', pad:11},
                        {r:[127,155,242,34], go:'reward-1', t:.28, e:'ease-out', a:'확인하러 가기'}]},
  // ── 미션 완료 후 리워드 제공
  'reward-1':   {g:'reward', hot:[{r:[159,291,72,72], go:'reward-2', t:.38, e:'ease-out', a:'별을 눌러 보상 확인'}]},
  'reward-2':   {g:'reward', auto:{after:.05, go:'reward-2-1', t:.46, e:'ease-out'}},
  'reward-2-1': {g:'reward', auto:{after:.05, go:'reward-3',   t:.46, e:'ease-out'}},   // 2→2-1과 같은 속도
  'reward-3':   {g:'reward', hot:[{r:[28,656,141,52],  go:'reward-check',    t:.28, e:'ease-out', a:'리워드 확인하기'},
                                  {r:[177,656,185,52], go:'reward-decorate', t:.24, e:'ease-out', a:'메인 화면에 장식하기'},
                                  {r:[28,750,334,56],  go:'next-quest-1',    t:.20, e:'ease-in-out', a:'다음 미션 확인하기'}]},
  'reward-decorate': {g:'reward', hot:[{r:[51,696,284,48], go:'main',     t:.26, e:'ease-out', a:'메인 화면으로 가기'},
                                       {r:[51,749,284,42], go:'reward-3', t:.24, e:'ease-out', a:'나중에'}]},
  // ── 미션 완료 후 새 미션 부여
  'next-quest-1': {g:'quest', auto:{after:.07,  go:'next-quest-2', t:.31, e:'linear'}},
  'next-quest-2': {g:'quest', auto:{after:.015, go:'next-quest-3', t:.31, e:'linear'}},
  'next-quest-3': {g:'quest', auto:{after:.015, go:'next-quest-4', t:.31, e:'linear'}},
  'next-quest-4': {g:'quest', auto:{after:.07,  go:'next-quest-5', t:.23, e:'ease-in-out'}},
  'next-quest-5': {g:'quest', auto:{after:.035, go:'next-quest-6', t:.26, e:'ease-in-out'}},
  'next-quest-6': {g:'quest', auto:{after:.025, go:'next-quest-7', t:.39, e:'ease-in-out'}},
  'next-quest-7': {g:'quest', hot:[{r:[28,725,334,56], go:'main', t:.28, e:'ease-out', a:'미션 확인 완료'}]},
  // ── 다른 팀원 화면과 이어질 자리 (지금은 그림만, 버튼 연결 없음)
  'main': {},
  'reward-check': {},       // 임시 화면
  // ── 로딩 · 오류 (해당 상황에서만 표시)
  'quest-loading':  {sys:true},
  'quest-error':    {sys:true, hot:[{r:[320,288,20,20], back:true, t:.2, e:'ease-out', a:'닫기', pad:12}]},
  'reward-loading': {sys:true},
  'reward-error':   {sys:true, hot:[{r:[320,288,20,20], back:true, t:.2, e:'ease-out', a:'닫기', pad:12}]},
};
// 피그마 Smart Animate 중간 장면 (피그마 「구동용_애니메이션_중간프레임」 페이지에서 내보냄, 30fps)
const ANIM = {
  'quest-01-1>quest-01-2':   ['quest-01-1_to_2', 9],
  'quest-01-2>quest-01-3':   ['quest-01-2_to_3', 10],
  'next-quest-1>next-quest-2': ['next-quest-1_to_2', 8],
  'next-quest-2>next-quest-3': ['next-quest-2_to_3', 8],
  'next-quest-3>next-quest-4': ['next-quest-3_to_4', 8],
  'next-quest-5>next-quest-6': ['next-quest-5_to_6', 7],
  'next-quest-6>next-quest-7': ['next-quest-6_to_7', 11],
  'reward-1>reward-2':       ['reward-1_to_2', 10],
  'reward-2>reward-2-1':     ['reward-2_to_2-1', 13],
};
const AC = window.MR_ANIM_COUNTS || {};
for (const v of Object.values(ANIM)) if (AC[v[0]]) v[1] = AC[v[0]];   // 내보낸 장면 수에 맞춤
const animSrc = (key, k) => { const id = 'anim__' + key + '__' + String(k).padStart(2,'0'); return ASSETS[id] || (ASSET_BASE + 'anim/' + id + '.jpg'); };
const GROUP_IDS = g => Object.keys(S).filter(k => S[k].g === g);
const PRESS_DELAY = 140;     // 버튼 눌림이 보이도록 이동 전 잠깐 멈춤 (ms)
const MIN_DISSOLVE = 0.36;   // 버튼으로 화면을 옮길 때 최소 전환 시간 (s)
const LOAD_DELAY = 250;      // 이보다 빨리 불러오면 로딩 화면을 띄우지 않음
const LOAD_TIMEOUT = 15000;  // 15초 이상 로딩 → 오류

const API = window.LinkXMissionReward = {
  onNavigate: null,          // (id) => true 를 돌려주면 그 화면은 합친 쪽에서 처리
  start, go, screens: S, current:()=>cur, inspect(id){if(!S[id])return;clearTimers();show(id,0);clearTimers();}, resume(){if(cur&&S[cur]?.auto){const a=S[cur].auto;go(a.go,a.t,a.e)}}
};

let phone, animEl, cur = null, stacks = {}, raf = 0, prevBeforeGroup = null, timers = [], loaded = {}, failed = {};
const forced = new URLSearchParams(location.search).get('force'); // 확인용: ?force=loading | error
let forcedUsed = false;

function build(){
  const root = document.getElementById('mr-root');
  phone = document.createElement('div'); phone.className = 'mr-phone'; root.appendChild(phone);
  for (const [id, cfg] of Object.entries(S)){
    const el = document.createElement('section'); el.className = 'mr-screen'; el.id = 'mr-' + id;
    el.setAttribute('aria-hidden','true');
    const img = new Image(); img.alt = ''; img.decoding = 'async';
    img.onload = () => { loaded[id] = true; }; img.onerror = () => { failed[id] = true; };
    img.src = src(id); el.appendChild(img);
    (cfg.hot||[]).forEach(h => {
      const b = document.createElement('button'); b.className = 'mr-hot'; b.type = 'button';
      const p = h.pad || 0; const [x,y,w,hh] = h.r;
      Object.assign(b.style, {left:(x-p)+'px', top:(y-p)+'px', width:(w+2*p)+'px', height:(hh+2*p)+'px'});
      if (h.rad) b.style.borderRadius = h.rad + 'px';
      b.setAttribute('aria-label', h.a || '');
      b.addEventListener('click', () => {
        if (b.classList.contains('pressed')) return;
        b.classList.add('pressed');
        const t = Math.max(h.t, MIN_DISSOLVE);
        setTimeout(() => { b.classList.remove('pressed'); h.back ? go(prevBeforeGroup || 'chat-mission-01', t, h.e) : go(h.go, t, h.e); }, PRESS_DELAY);
      });
      el.appendChild(b);
    });
    phone.appendChild(el);
  }
  animEl = document.createElement('section'); animEl.className = 'mr-screen mr-anim'; animEl.setAttribute('aria-hidden','true');
  phone.appendChild(animEl);
  const dev = document.createElement('div'); dev.className = 'mr-dev';
  dev.innerHTML = '<button type="button" data-f="mission">흐름 1 · 미션 부여</button><button type="button" data-f="reward">흐름 2 · 리워드</button>'
    + '<button type="button" data-x="loading">로딩 확인</button><button type="button" data-x="error">오류 확인</button>'
    + (forced ? '<button type="button" data-x="">확인 끝내기</button>' : '');
  dev.addEventListener('click', e => {
    const f = e.target.dataset.f, x = e.target.dataset.x;
    if (f){ location.hash = f; start(f); }
    if (x !== undefined){ location.search = x ? '?force=' + x : ''; }   // 다시 열림 · 지금 흐름(#) 유지
  });
  // Flow controls are provided by the outer prototype navigator.
  if(window.parent===window)root.appendChild(dev);
  addEventListener('resize', fit); fit();
}
function fit(){
  const w = innerWidth, h = innerHeight;
  const s = w <= 430 ? Math.min(w/390, h/844) : Math.min(1, (h-40)/844, (w-40)/390);
  phone.style.transform = 'scale(' + s + ')';
}
function clearTimers(){ timers.forEach(clearTimeout); timers = []; if (raf){ cancelAnimationFrame(raf); raf = 0; } }
function show(id, t, e){
  document.querySelectorAll('.mr-screen').forEach(s => {
    const on = s.id === 'mr-' + id;
    s.style.transitionDuration = (t||0) + 's';
    s.style.transitionTimingFunction = e || 'ease-out';
    s.classList.toggle('on', on); s.setAttribute('aria-hidden', on ? 'false' : 'true');
  });
  cur = id;
  const a = S[id].auto;
  if (a) timers.push(setTimeout(() => go(a.go, a.t, a.e), ((t||0) + a.after) * 1000));
}
function groupReady(g){
  const ids = GROUP_IDS(g);
  if (ids.some(i => failed[i])) return 'fail';
  return ids.every(i => loaded[i]) ? 'ok' : 'wait';
}
function go(id, t = .28, e = 'ease-out'){
  if (!S[id]) return;
  if(id==='main'){location.href='../main/index.html';return;}
  clearTimers();
  if (API.onNavigate && API.onNavigate(id) === true) return;
  const g = S[id].g, from = (cur && S[cur]) ? cur : null;
  if (g && (!from || S[from].g !== g)){          // 묶음(첫 미션 부여 등)에 처음 들어갈 때만 확인
    prevBeforeGroup = from;
    const force = (!forcedUsed && forced) ? forced : null; forcedUsed = forcedUsed || !!forced;
    let st = force === 'error' ? 'fail' : (force === 'loading' ? 'wait' : groupReady(g));
    if (st === 'fail') return show(g + '-error', t, e);
    if (st === 'wait'){
      const started = Date.now();
      const wait = () => {
        const s2 = force ? (Date.now() - started > LOAD_TIMEOUT ? 'fail' : 'wait') : groupReady(g);
        if (s2 === 'ok') return show(id, .28, 'ease-out');
        if (s2 === 'fail' || Date.now() - started > LOAD_TIMEOUT) return show(g + '-error', .2, 'ease-out');
        timers.push(setTimeout(wait, 100));
      };
      timers.push(setTimeout(() => { if (cur !== id) show(g + '-loading', .2, 'ease-out'); wait(); }, force ? 0 : LOAD_DELAY));
      return;
    }
  }
  if (g) prepareGroup(g);
  const an = from && ANIM[from + '>' + id];
  if (an) return play(from, id, t);
  show(id, t, e);
}
// 전환마다 [출발 화면, 중간 장면 1…n, 도착 화면]을 겹쳐 두고 미리 디코딩 → 재생 중 끊김 방지
function prepare(pair){
  if (stacks[pair]) return stacks[pair].ready;
  const [from, to] = pair.split('>'), [key, n] = ANIM[pair];
  const box = document.createElement('div'); box.className = 'mr-stack';
  const list = [src(from)]; for (let k = 1; k <= n; k++) list.push(animSrc(key, k)); list.push(src(to));
  const imgs = list.map(u => { const im = new Image(); im.alt = ''; im.src = u; box.appendChild(im); return im; });
  animEl.appendChild(box);
  const ready = Promise.all(imgs.map(im => im.decode ? im.decode().catch(()=>{}) : Promise.resolve()));
  stacks[pair] = {box, imgs, ready}; return ready;
}
function prepareGroup(g){
  for (const pair of Object.keys(ANIM)) if (S[pair.split('>')[0]].g === g) prepare(pair);
  for (const pair of Object.keys(stacks)) if (S[pair.split('>')[0]].g !== g){ stacks[pair].box.remove(); delete stacks[pair]; }  // 메모리 정리
}
// 중간 장면을 피그마 전환 시간에 맞춰 이어 붙여 재생 (requestAnimationFrame + 이웃 장면끼리 섞기)
function play(from, id, dur){
  const pair = from + '>' + id; prepare(pair);
  const st = stacks[pair];
  st.ready.then(() => {
    if (cur !== from) return;                       // 그 사이 다른 화면으로 이동했으면 취소
    const imgs = st.imgs, last = imgs.length - 1;
    Object.values(stacks).forEach(o => o.box.style.display = o === st ? 'block' : 'none');
    imgs.forEach((im, i) => im.style.opacity = i === 0 ? 1 : 0);
    document.querySelectorAll('.mr-screen').forEach(s => { s.style.transitionDuration = '0s'; s.classList.toggle('on', s === animEl); });
    cur = '__anim';
    const t0 = performance.now(), ms = dur * 1000;
    const tick = now => {
      const pos = Math.min(1, (now - t0) / ms) * last, i = Math.floor(pos), f = pos - i;
      for (let k = 0; k <= last; k++) imgs[k].style.opacity = k === i ? 1 : (k === i + 1 ? f : 0);
      if (pos < last) raf = requestAnimationFrame(tick); else { raf = 0; show(id, 0); }
    };
    raf = requestAnimationFrame(tick);
  });
}
function start(flow){ cur = null; go(flow === 'reward' ? 'chat-done-01' : 'chat-mission-01', 0); }

build();
start(location.hash.replace('#','') === 'reward' ? 'reward' : 'mission');
addEventListener('hashchange', () => start(location.hash.replace('#','')));
})();

</script>
</body>
</html>
