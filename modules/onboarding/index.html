<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LinkX · 스플래시</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0e1440;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}

  /* 390 × 844 (iPhone 13/14) 화면을 창 크기에 맞춰 축소 */
  .device{width:390px;height:844px;position:relative;overflow:hidden;transform-origin:center center;border-radius:0}

  /* 배경 그라데이션 — 피그마 프레임 1→2→3·4 단계를 겹쳐서 크로스페이드 */
  .sky{position:absolute;inset:0;transition:opacity 1.2s ease}
  .sky-1{background:linear-gradient(180deg,#192D90 0%,#352897 65%,#9180C3 100%)}
  .sky-2{background:linear-gradient(180deg,#192D90 0%,#352897 47%,#9180C3 95%,#E0D7FC 100%);opacity:0}
  .sky-3{background:linear-gradient(180deg,#192D90 0%,#352897 37%,#9180C3 72%,#E0D7FC 100%);opacity:0}

  .layer{position:absolute;inset:0;pointer-events:none}
  .layer svg,.layer img{position:absolute;display:block}

  .sky-4{background:linear-gradient(180deg,#192D90 0%,#352897 33%,#9180C3 66%,#E0D7FC 88%);opacity:0}

  /* 캐릭터 · 시그니처 */
  .mascot{position:absolute;width:103px;height:103px;left:144px;top:371px;opacity:0;transform:scale(0);
          transition:left .8s cubic-bezier(.4,0,.2,1)}
  .mascot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .08s}
  .mascot .wink{opacity:0;left:3px;top:-4px} /* 윙크 위치: 피그마 (42,367) */
  .signature{position:absolute;left:143.76px;top:373.23px;width:201px;height:85px;opacity:0;transform:translateX(-14px);
             transition:opacity .6s ease,transform .6s ease}

  /* 뿅 — 커졌다가 살짝 줄어들며 자리 잡기 */
  @keyframes pop{0%{opacity:0;transform:scale(0)}55%{opacity:1;transform:scale(1.18)}75%{transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
  @keyframes facePop{0%{transform:scale(1)}35%{transform:scale(1.16)}65%{transform:scale(.95)}100%{transform:scale(1)}}

  /* 1 → 2: 캐릭터 뿅 */
  .s2 .sky-2{opacity:1}
  .s2 .mascot{opacity:1;transform:scale(1);animation:pop .55s cubic-bezier(.34,1.3,.64,1)}
  /* 2 → 3: 캐릭터 옆으로, 로고 등장 */
  .s3 .sky-3{opacity:1}
  .s3 .mascot{left:39px}
  .s3 .signature{opacity:1;transform:none;transition-delay:.3s}
  /* 3 → 4: 뿅 하고 얼굴 바뀜 */
  .s4 .sky-4{opacity:1}
  .s4 .mascot{animation:facePop .45s ease-out}
  .s4 .mascot .base{opacity:0}
  .s4 .mascot .wink{opacity:1}
</style>
</head>

SPARK.forEach(([x,y,s])=>{const k=s/6;h+=`<path transform="translate(${x} ${y}) scale(${k})" opacity=".6" d="M3 0C3 2 4 3 6 3C4 3 3 4 3 6C3 4 2 3 0 3C2 3 3 2 3 0Z" fill="#F7F1FF"/>`});
HERO.forEach(([x,y,s,o])=>{h+=`<use href="#hero" transform="translate(${x} ${y}) scale(${s/30})" opacity="${o}"/>`});
STAR.forEach(([x,y,s,o])=>{h+=`<use href="#star" transform="translate(${x} ${y}) scale(${s/10})" opacity="${(o*.8).toFixed(2)}"/>`});
DUST.forEach(([x,y,o])=>{h+=`<circle cx="${x+.8}" cy="${y+.8}" r=".8" fill="#F7F1FF" opacity="${o}"/>`});
sky.innerHTML=h;
document.getElementById('stars').appendChild(sky);

/* ---------- 화면 크기에 맞춰 축소 ---------- */
const dev=document.getElementById('splash');
function fit(){const s=Math.min(innerWidth/390,innerHeight/844,1);dev.style.transform=`scale(${s})`;}
fit();addEventListener('resize',fit);

/* ---------- 스플래시 시퀀스 (피그마 프레임 4장 순서) ----------
   1 빈 밤하늘 → 2 캐릭터 뿅 → 3 캐릭터 옆으로 + LinkX 로고 → 4 뿅 하고 얼굴 바뀜  */
const TIMING={s2:500,s3:1500,s4:2700,end:3700}; // ms
function play(){
  dev.className='device';
  setTimeout(()=>dev.classList.add('s2'),TIMING.s2);
  setTimeout(()=>dev.classList.add('s3'),TIMING.s3);
  setTimeout(()=>dev.classList.add('s4'),TIMING.s4);
  setTimeout(()=>{
    // 다른 팀원 HTML과 합칠 때: 여기서 메인 화면으로 전환
    document.dispatchEvent(new CustomEvent('splash:end'));
    if(typeof window.onSplashEnd==='function') window.onSplashEnd();
  },TIMING.end);
}
play();
// 미리보기용: 화면을 누르면 다시 재생
dev.addEventListener('click',play);
</script>
</body>
</html>
